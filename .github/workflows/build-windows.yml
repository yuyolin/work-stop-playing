name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name="工作！！别他妈玩了！"
          --icon="icon.ico"
          --add-data="icon.png;."
          --add-data="icon.ico;."
          app.pyw

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: work-stop-playing-windows
          path: dist/*.exe
          if-no-files-found: error
